apply plugin: 'com.android.application'

android {
    namespace 'com.deepsea.jarviscontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.deepsea.jarviscontrol"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
