<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JARVIS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #0a0e14; color: #d7f4ff;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 16px; text-align: center; letter-spacing: 3px;
    color: #4fd7ff; border-bottom: 1px solid #17222e; font-weight: 700;
  }
  #setup {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
  }
  #setup input {
    width: 100%; max-width: 320px; padding: 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid #234; background: #0f1620; color: #d7f4ff;
  }
  #setup button, #main button {
    padding: 14px 20px; font-size: 16px; border-radius: 10px; border: none;
    background: #16b7ff; color: #001622; font-weight: 700;
  }
  #setup p { color: #6a8; font-size: 13px; max-width: 320px; text-align: center; }
  #err { color: #ff6b7a; min-height: 18px; font-size: 14px; }

  #main { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #orb {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
  }
  #dot {
    width: 140px; height: 140px; border-radius: 50%;
    border: 3px solid #16b7ff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #4fd7ff;
    box-shadow: 0 0 40px rgba(22,183,255,0.25);
    transition: box-shadow 0.2s ease;
  }
  #dot.speaking { box-shadow: 0 0 60px rgba(63,224,138,0.5); border-color: #3fe08a; color: #3fe08a; }
  #dot.listening { box-shadow: 0 0 60px rgba(22,183,255,0.5); }
  #statusText { color: #6a8; font-size: 13px; }

  #log { flex: 0 0 160px; overflow-y: auto; padding: 10px 16px; font-size: 13px; line-height: 1.5; border-top: 1px solid #17222e; }
  .line { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .sys { color: #6a8; font-style: italic; }

  #controls { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #17222e; }
  #controls button { flex: 1; }
  #muteBtn.muted { background: #ff3355; color: #fff; }
  #disconnectBtn { background: #1a2530; color: #d7f4ff; }
</style>
</head>
<body>
<header>JARVIS</header>

<div id="setup">
  <p>Apni Gemini API key daalo (sirf is phone par save hogi, kahin aur nahi jaayegi).</p>
  <input id="apiKey" type="password" placeholder="Gemini API key" autocomplete="off">
  <button onclick="startJarvis()">Connect</button>
  <div id="err"></div>
</div>

<div id="main">
  <div id="orb">
    <div id="dot">JARVIS</div>
    <div id="statusText">Connecting...</div>
  </div>
  <div id="log"></div>
  <div id="controls">
    <button id="muteBtn" onclick="toggleMute()">Mute</button>
    <button id="disconnectBtn" onclick="disconnect()">Disconnect</button>
  </div>
</div>

<script>
const SEND_RATE = 16000;
const RECV_RATE = 24000;
const MODEL = "models/gemini-3.1-flash-live-preview";

const SYSTEM_PROMPT = `You are JARVIS, a concise voice assistant running on the user's phone.
- Speak in Hinglish (a natural mix of Hindi and English, written in Roman/English script) by default, unless the user clearly speaks in pure English.
- Always address the user as "Boss".
- Keep spoken answers short and useful.
- Answer ordinary questions, explanations, reasoning, and general knowledge directly.
- You do not control any laptop, email, or trading account from here - if asked to do those things, tell the user this phone JARVIS is voice-conversation only and to use the laptop JARVIS for that.
- Respond in the same language the user spoke.`;

let ws = null;
let audioCtx = null;
let micStream = null;
let micNode = null;
let muted = false;
let playTime = 0;
let sessionHandle = null;

function log(text, cls) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setStatus(text, dotClass) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('dot');
  dot.className = dotClass || '';
}

function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function arrayBufferToBase64(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function pcm16ToFloat32(int16Buf) {
  const int16 = new Int16Array(int16Buf);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  return float32;
}

function float32ToPcm16(float32) {
  const int16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    int16[i] = s < 0 ? s * 32768 : s * 32767;
  }
  return int16.buffer;
}

async function startJarvis() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    document.getElementById('err').textContent = 'API key zaroori hai';
    return;
  }
  localStorage.setItem('jarvis_api_key', apiKey);

  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  setStatus('Connecting...', '');

  try {
    await connect(apiKey);
  } catch (e) {
    log('Connection error: ' + e.message, 'sys');
    setStatus('Connection failed', '');
  }
}

async function connect(apiKey) {
  const uri = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
  ws = new WebSocket(uri);

  ws.onopen = () => {
    const setup = {
      setup: {
        model: MODEL,
        generation_config: {
          response_modalities: ["AUDIO"],
          speech_config: { voice_config: { prebuilt_voice_config: { voice_name: "Puck" } } },
        },
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      },
    };
    ws.send(JSON.stringify(setup));
  };

  ws.onmessage = async (event) => {
    const text = typeof event.data === 'string' ? event.data : await event.data.text();
    let data;
    try { data = JSON.parse(text); } catch (e) { return; }

    if (data.setupComplete) {
      log('JARVIS connected.', 'sys');
      setStatus('Listening...', 'listening');
      startMic();
      return;
    }

    if (data.sessionResumptionUpdate && data.sessionResumptionUpdate.newHandle) {
      sessionHandle = data.sessionResumptionUpdate.newHandle;
    }

    if (data.serverContent) {
      const sc = data.serverContent;
      const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
      for (const p of parts) {
        if (p.inlineData && p.inlineData.data) {
          playAudioChunk(p.inlineData.data);
        }
      }
      if (sc.turnComplete) {
        setStatus('Listening...', 'listening');
      }
      if (sc.interrupted) {
        setStatus('Listening...', 'listening');
      }
    }
  };

  ws.onerror = () => {
    log('WebSocket error.', 'sys');
  };

  ws.onclose = (event) => {
    log('Disconnected: ' + (event.reason || event.code), 'sys');
    setStatus('Disconnected', '');
    stopMic();
  };
}

async function startMic() {
  if (micStream) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
  } catch (e) {
    log('Mic permission denied: ' + e.message, 'sys');
    return;
  }

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SEND_RATE });
  const source = audioCtx.createMediaStreamSource(micStream);
  micNode = audioCtx.createScriptProcessor(4096, 1, 1);

  micNode.onaudioprocess = (e) => {
    if (muted || !ws || ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm = float32ToPcm16(input);
    const b64 = arrayBufferToBase64(pcm);
    ws.send(JSON.stringify({
      realtime_input: { media_chunks: [{ data: b64, mime_type: `audio/pcm;rate=${SEND_RATE}` }] },
    }));
  };

  source.connect(micNode);
  micNode.connect(audioCtx.destination);
}

function stopMic() {
  if (micNode) { micNode.disconnect(); micNode = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
}

function playAudioChunk(b64) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = base64ToArrayBuffer(b64);
  const float32 = pcm16ToFloat32(buf);

  const audioBuffer = audioCtx.createBuffer(1, float32.length, RECV_RATE);
  audioBuffer.getChannelData(0).set(float32);

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (playTime < now) playTime = now;
  src.start(playTime);
  setStatus('Speaking...', 'speaking');
  playTime += audioBuffer.duration;
}

function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.textContent = muted ? 'Unmute' : 'Mute';
  btn.className = muted ? 'muted' : '';
}

function disconnect() {
  stopMic();
  if (ws) { ws.close(); ws = null; }
  document.getElementById('main').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('jarvis_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
});
</script>
</body>
</html>
