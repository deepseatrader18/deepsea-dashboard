<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEPSEA — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void-deep:#02060b;
    --panel-edge:rgba(47,230,255,0.28);
    --cyan:#2fe6ff;
    --cyan-dim:rgba(47,230,255,0.45);
    --teal:#17e8b0;
    --danger:#ff4d5e;
    --text-hi:#e6f4fb;
    --text-mid:#8fa8bd;
    --text-dim:#4c6377;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 30% 20%, rgba(23,60,90,0.35), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(23,232,176,0.06), transparent 50%),
      var(--void-deep);
    color:var(--text-hi);
    font-family:'Inter', sans-serif;
    height:100vh;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .head-font{font-family:'Space Grotesk', sans-serif;}
  .bg-grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(47,230,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,230,255,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse at center, black 0%, transparent 70%);
  }
  .login-card{
    position:relative;
    width:380px;
    max-width:90vw;
    padding:40px 36px 34px;
    background:linear-gradient(180deg, rgba(10,22,38,0.9), rgba(5,10,18,0.9));
    border:1px solid var(--panel-edge);
    clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    box-shadow:0 0 40px rgba(47,230,255,0.08), inset 0 0 60px rgba(47,230,255,0.03);
  }
  .login-mark{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .login-mark .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 12px 2px var(--cyan);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .login-title{font-size:26px; font-weight:700; letter-spacing:2px;}
  .login-sub{color:var(--text-dim); font-size:12.5px; margin-top:6px; letter-spacing:0.5px;}
  .login-form{margin-top:32px;}
  .field-label{font-size:11px; color:var(--text-mid); letter-spacing:1.5px; margin-bottom:8px; display:block;}
  #master-pass{
    width:100%;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(143,168,189,0.25);
    color:var(--text-hi);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:12px 14px;
    letter-spacing:2px;
    outline:none;
    transition:border-color .2s ease;
  }
  #master-pass:focus{border-color:var(--cyan);}
  .login-error{color:var(--danger); font-size:12px; margin-top:10px; min-height:16px;}
  #login-btn{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:transparent;
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:2px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  #login-btn:hover{background:var(--cyan); color:#031014;}
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="login-card">
    <div class="login-mark"><span class="dot"></span><span style="font-size:11px; letter-spacing:3px; color:var(--text-dim);">SYSTEM ACCESS</span></div>
    <div class="login-title head-font">DEEP<span style="color:var(--cyan);">SEA</span></div>
    <div class="login-sub mono">AUTONOMOUS TRADING &amp; AGENT CONTROL</div>
    <form class="login-form" id="login-form" method="POST" action="/login">
      <label class="field-label" for="master-pass">MASTER PASSWORD</label>
      <input type="password" id="master-pass" name="password" autocomplete="off" placeholder="••••••••" required>
      <div class="login-error" id="login-error"></div>
      <button type="submit" id="login-btn">AUTHENTICATE</button>
    </form>
  </div>
<script>
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('login-error').textContent = 'Access denied — incorrect password.';
  }
</script>
</body>
</html>
