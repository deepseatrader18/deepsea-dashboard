<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEPSEA · NEWS ROOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070f;
    --panel: #0b1220;
    --panel-2: #0d1626;
    --border: #1a2740;
    --border-soft: #141f36;
    --text: #dce6f7;
    --text-dim: #7688a8;
    --text-faint: #4c5b78;
    --accent: #35c7ff;
    --accent-soft: rgba(53,199,255,.14);
    --violet: #8b7bff;
    --violet-soft: rgba(139,123,255,.14);
    --bull: #2fdb96;
    --bull-soft: rgba(47,219,150,.14);
    --bear: #ff4d6d;
    --bear-soft: rgba(255,77,109,.14);
    --amber: #ffb648;
    --amber-soft: rgba(255,182,72,.14);
    --shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 560px at 15% -8%, rgba(53,199,255,.09), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(139,123,255,.08), transparent 55%),
      radial-gradient(700px 420px at 50% 100%, rgba(255,182,72,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    padding:22px 16px 70px;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Chakra Petch', 'Inter', sans-serif;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}

  .wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:2;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);border-radius:14px;
    padding:16px 20px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .topbar::before{
    content:"";position:absolute;inset:0 0 auto 0;height:2px;
    background:linear-gradient(90deg, var(--amber), var(--accent) 55%, transparent);
    opacity:.7;
  }
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:conic-gradient(from 220deg, var(--amber), var(--accent), var(--amber));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px -4px var(--amber);
    animation: markSpin 8s linear infinite;
  }
  @keyframes markSpin{ to{ filter:hue-rotate(360deg); } }
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{font-size:16px;font-weight:700;letter-spacing:.06em;margin:0;color:#eef4ff;}
  .brand-text .sub{font-size:10.5px;color:var(--text-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .back-link{
    font-size:11px; font-weight:600; letter-spacing:.05em; color:var(--text-dim);
    text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:8px;
  }
  .clock{font-size:12px;color:var(--text-faint);}
  .notify-btn{font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;}
  .notify-btn.on{color:var(--bull);border-color:rgba(47,219,150,.35);background:var(--bull-soft);}

  /* ---- HUD summary strip ---- */
  .summary-row{display:flex;gap:14px;flex-wrap:wrap;}
  .summary-card{
    flex:1;min-width:150px;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .summary-card::after{
    content:""; position:absolute; inset:auto 0 0 0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.5;
  }
  .summary-card .k{font-size:10px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;}
  .summary-card .v{font-size:22px;font-weight:700;color:#eef4ff;margin-top:4px;}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px;flex-wrap:wrap;}
  .panel-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);}
  .panel-title .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .panel-note{font-size:10.5px;color:var(--text-faint);}

  .empty-state{padding:60px 12px;text-align:center;color:var(--text-dim);font-size:13px;}

  /* ---- The 3D holographic stage ---- */
  .stage{
    position:relative;
    perspective:1500px;
    padding:26px 4px 56px;
    min-height:220px;
  }
  .floor{
    position:absolute; left:0; right:0; bottom:-10px; height:260px;
    background-image:
      linear-gradient(rgba(53,199,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,199,255,.16) 1px, transparent 1px);
    background-size:46px 46px;
    transform:rotateX(78deg);
    transform-origin:bottom center;
    -webkit-mask-image:linear-gradient(to top, black, transparent 85%);
    mask-image:linear-gradient(to top, black, transparent 85%);
    opacity:.4;
    pointer-events:none;
    animation:floorDrift 6s linear infinite;
  }
  @keyframes floorDrift{ from{background-position:0 0, 0 0;} to{background-position:0 46px, 46px 0;} }

  .cards-grid{
    position:relative; z-index:2;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:26px;
  }

  .event-card{
    position:relative;
    background:linear-gradient(160deg, rgba(15,25,44,.92), rgba(9,15,27,.9));
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px 18px;
    transform-style:preserve-3d;
    transform:translateZ(0) rotateX(3deg);
    box-shadow:0 22px 40px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
    transition:box-shadow .25s ease, border-color .25s ease;
    animation:cardFloat 5.5s ease-in-out infinite;
    will-change:transform;
  }
  .event-card:hover{ animation-play-state:paused; border-color:rgba(53,199,255,.4); }
  @keyframes cardFloat{
    0%,100%{ transform:translateZ(0) translateY(0) rotateX(3deg); }
    50%{ transform:translateZ(8px) translateY(-6px) rotateX(2deg); }
  }

  .event-card.awaiting{ border-color:rgba(255,182,72,.3); }
  .event-card.released{ border-color:rgba(47,219,150,.28); }

  .ec-glow{
    position:absolute; inset:-1px; border-radius:17px; z-index:-1;
    background:radial-gradient(120px 80px at 20% 0%, rgba(53,199,255,.14), transparent 70%);
    opacity:0; transition:opacity .25s ease;
  }
  .event-card:hover .ec-glow{ opacity:1; }

  .event-card.flash::before{
    content:""; position:absolute; inset:-2px; border-radius:18px;
    border:2px solid var(--accent);
    animation:pingRing 1.3s ease-out 2;
    pointer-events:none;
  }
  @keyframes pingRing{ 0%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(1.12); } }

  .ec-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .ec-time{
    font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; color:#eef4ff;
    text-shadow:0 0 14px rgba(53,199,255,.35);
  }
  .ec-flag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em;
    padding:3px 8px; border-radius:6px; background:var(--violet-soft); color:var(--violet);
  }

  .ec-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:12px;min-height:34px;}

  .ec-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .ec-stat{background:rgba(0,0,0,.22);border:1px solid var(--border-soft);border-radius:9px;padding:6px 8px;text-align:center;}
  .ec-stat .k{font-size:8.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;}
  .ec-stat .v{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-top:2px;}
  .ec-stat.actual .v{color:var(--text-faint);}
  .ec-stat.actual.released{background:rgba(47,219,150,.08);border-color:rgba(47,219,150,.3);}
  .ec-stat.actual.released .v{color:var(--bull);}
  .ec-stat.actual.awaiting .v{
    color:var(--amber); animation:pulseText 1.6s ease-in-out infinite;
  }
  @keyframes pulseText{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  .ec-status{
    display:flex; align-items:center; gap:6px; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:10px;
  }
  .ec-status .sd{width:6px;height:6px;border-radius:50%;flex:none;}
  .ec-status.awaiting .sd{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blinkDot 1.4s ease-in-out infinite;}
  .ec-status.released .sd{background:var(--bull);box-shadow:0 0 8px var(--bull);}
  @keyframes blinkDot{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .ec-impact{display:flex;flex-direction:column;gap:6px;}
  .impact-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;width:fit-content;}
  .impact-badge .sym{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .impact-badge.bullish{background:var(--bull-soft);color:var(--bull);}
  .impact-badge.bearish{background:var(--bear-soft);color:var(--bear);}
  .impact-badge.neutral{background:rgba(118,136,168,.16);color:#9db0cc;}
  .impact-badge.pending{background:var(--amber-soft);color:var(--amber);}
  .impact-none{font-size:10.5px;color:var(--text-faint);font-style:italic;}
  .impact-analyzing{font-size:10.5px;color:var(--text-faint);}

  @media (max-width:600px){
    .stage{ perspective:none; padding:14px 0 30px; }
    .floor{ display:none; }
    .event-card{ animation:none; transform:none; }
    .event-card:hover{ transform:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="#04121c" stroke-width="2"/><path d="M8 9h8M8 13h8M8 17h5" stroke="#04121c" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>DEEPSEA · NEWS ROOM</h1>
        <div class="sub">Real calendar · AI impact research</div>
      </div>
    </div>
    <div class="top-right">
      <button class="notify-btn" id="notifyBtn">🔔 Notify me</button>
      <span class="clock mono" id="hdrClock">—</span>
      <a href="/trading" class="back-link">TRADING ROOM →</a>
      <a href="/" class="back-link">← HUB</a>
    </div>
  </div>

  <div class="summary-row">
    <div class="summary-card">
      <div class="k">Today's High-Impact Events</div>
      <div class="v mono" id="sumTotal">—</div>
    </div>
    <div class="summary-card">
      <div class="k">Released</div>
      <div class="v mono" id="sumReleased">—</div>
    </div>
    <div class="summary-card">
      <div class="k">Awaiting Release</div>
      <div class="v mono" id="sumPending">—</div>
    </div>
    <div class="summary-card">
      <div class="k">Last Refreshed</div>
      <div class="v mono" id="sumRefreshed" style="font-size:14px;">—</div>
    </div>
  </div>

  <div class="panel-head">
    <div class="panel-title"><span class="dot"></span>Today's Economic Calendar (IST)</div>
    <div class="panel-note">Real Forex Factory data · AI reasons over it for likely instrument impact, never invents the numbers</div>
  </div>

  <div class="stage">
    <div class="floor"></div>
    <div id="calendarWrap"><div class="empty-state">Loading…</div></div>
  </div>

</div>

<script>
  function tickClock(){
    document.getElementById('hdrClock').textContent = new Date().toLocaleString('en-GB', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }
  tickClock();
  setInterval(tickClock, 1000);

  let notificationsEnabled = false;
  const lastActualByKey = new Map();

  function eventKey(item){
    return item.country + '|' + item.title + '|' + (item.date || '');
  }

  function fmtEventTime(dateStr){
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function notifyRelease(item){
    if (!notificationsEnabled || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try {
      new Notification(`${item.country} — ${item.title}`, {
        body: `Actual: ${item.actual}  (Forecast: ${item.forecast ?? 'n/a'}, Previous: ${item.previous ?? 'n/a'})`,
        tag: eventKey(item)
      });
    } catch (e) { /* Notification constructor can throw on some browsers/contexts; ignore */ }
  }

  document.getElementById('notifyBtn').addEventListener('click', async () => {
    if (typeof Notification === 'undefined') {
      alert('This browser does not support notifications.');
      return;
    }
    const permission = await Notification.requestPermission();
    notificationsEnabled = permission === 'granted';
    const btn = document.getElementById('notifyBtn');
    btn.classList.toggle('on', notificationsEnabled);
    btn.textContent = notificationsEnabled ? '🔔 Notifications on' : '🔔 Notify me';
  });

  function renderImpact(impact){
    const wrap = document.createElement('div');
    wrap.className = 'ec-impact';
    if (!impact || !Array.isArray(impact.affects)) {
      const span = document.createElement('span');
      span.className = 'impact-analyzing';
      span.textContent = 'AI read pending…';
      wrap.appendChild(span);
      return wrap;
    }
    if (!impact.affects.length) {
      const span = document.createElement('span');
      span.className = 'impact-none';
      span.textContent = 'No major pairs affected';
      wrap.appendChild(span);
      return wrap;
    }
    impact.affects.forEach(a => {
      const dir = (a.direction || '').toLowerCase();
      const cls = dir === 'bullish' ? 'bullish' : dir === 'bearish' ? 'bearish' : dir === 'awaiting release' ? 'pending' : 'neutral';
      const badge = document.createElement('span');
      badge.className = 'impact-badge ' + cls;
      badge.title = a.reason || '';
      badge.innerHTML = `<span class="sym">${a.symbol}</span>${(a.direction || '').toUpperCase()}`;
      wrap.appendChild(badge);
    });
    return wrap;
  }

  // Subtle mouse-follow tilt on hover — pauses the idle float animation
  // (see .event-card:hover in CSS) so the two transforms never fight.
  function attachTilt(card){
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      const rotateY = (px - 0.5) * 14;
      const rotateX = (0.5 - py) * 14;
      card.style.transform = `translateZ(26px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  }

  function buildEventCard(item, index){
    const isReleased = item.actual != null;
    const card = document.createElement('div');
    card.className = 'event-card ' + (isReleased ? 'released' : 'awaiting');
    card.style.animationDelay = (-(index % 6) * 0.9) + 's';

    const glow = document.createElement('div');
    glow.className = 'ec-glow';
    card.appendChild(glow);

    const top = document.createElement('div');
    top.className = 'ec-top';
    top.innerHTML = `<span class="ec-time mono">${fmtEventTime(item.date)}</span><span class="ec-flag">${item.country || '—'}</span>`;
    card.appendChild(top);

    const title = document.createElement('div');
    title.className = 'ec-title';
    title.textContent = item.title;
    card.appendChild(title);

    const status = document.createElement('div');
    status.className = 'ec-status ' + (isReleased ? 'released' : 'awaiting');
    status.innerHTML = `<span class="sd"></span>${isReleased ? 'Result received' : 'Awaiting release'}`;
    card.appendChild(status);

    const stats = document.createElement('div');
    stats.className = 'ec-stats';
    stats.innerHTML = `
      <div class="ec-stat"><div class="k">Forecast</div><div class="v">${item.forecast ?? '—'}</div></div>
      <div class="ec-stat"><div class="k">Previous</div><div class="v">${item.previous ?? '—'}</div></div>
      <div class="ec-stat actual ${isReleased ? 'released' : 'awaiting'}"><div class="k">Actual</div><div class="v">${isReleased ? item.actual : '···'}</div></div>
    `;
    card.appendChild(stats);

    card.appendChild(renderImpact(item.impact));
    attachTilt(card);
    return card;
  }

  function renderCalendar(news){
    const wrap = document.getElementById('calendarWrap');
    const sumTotal = document.getElementById('sumTotal');
    const sumReleased = document.getElementById('sumReleased');
    const sumPending = document.getElementById('sumPending');

    if (!news.available) {
      wrap.innerHTML = `<div class="empty-state">News calendar not available right now (${news.reason}).</div>`;
      sumTotal.textContent = '—';
      sumReleased.textContent = '—';
      sumPending.textContent = '—';
      return;
    }
    if (!news.data.length) {
      wrap.innerHTML = '<div class="empty-state">No high-impact events scheduled for today.</div>';
      sumTotal.textContent = '0';
      sumReleased.textContent = '0';
      sumPending.textContent = '0';
      return;
    }

    const released = news.data.filter(e => e.actual != null).length;
    sumTotal.textContent = news.data.length;
    sumReleased.textContent = released;
    sumPending.textContent = news.data.length - released;

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    news.data.forEach((item, index) => {
      const key = eventKey(item);
      const isKnown = lastActualByKey.has(key);
      const prevActual = lastActualByKey.get(key);
      const justReleased = isKnown && prevActual == null && item.actual != null;

      const card = buildEventCard(item, index);
      if (justReleased) {
        card.classList.add('flash');
        notifyRelease(item);
      }
      grid.appendChild(card);

      lastActualByKey.set(key, item.actual ?? null);
    });

    wrap.innerHTML = '';
    wrap.appendChild(grid);
  }

  async function loadNewsDashboard(){
    try {
      const res = await fetch('/api/news-dashboard');
      const news = await res.json();
      renderCalendar(news);
      document.getElementById('sumRefreshed').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    } catch (err) {
      console.error('News dashboard fetch failed:', err);
    }
  }

  loadNewsDashboard();
  setInterval(loadNewsDashboard, 10000);
</script>

</body>
</html>
