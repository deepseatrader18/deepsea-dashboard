services:
  - type: web
    name: deepsea-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VPS_STATUS_URL
        sync: false
      - key: VPS_STATUS_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
