services:
  - type: web
    name: deepsea-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VPS_STATUS_URL
        sync: false
      - key: VPS_STATUS_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TECHNICAL_SERVICE_URL
        sync: false

  - type: web
    name: deepsea-technical-service
    runtime: python
    plan: free
    buildCommand: cd technical-service && pip install -r requirements.txt
    startCommand: cd technical-service && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false
